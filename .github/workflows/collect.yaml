---
name: Collect
on:
  schedule:
    - cron: "0 1 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: One month to fetch as YYYY-MM, instead of the last two
        required: false
permissions: {}
concurrency:
  group: data
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install the PDF tools the redaction needs
        run: sudo apt-get install -y --no-install-recommends poppler-utils ghostscript imagemagick

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/femiwiki-github-io
          aws-region: ap-northeast-1

      - name: Check out the data branch, or start it
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=data data
          cd data
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}"
          git pull --quiet origin data || true

      - env:
          MONTH: ${{ inputs.month }}
        run: scripts/collect.sh data ${MONTH:+"$MONTH"}

      - env:
          MONTH: ${{ inputs.month }}
        run: scripts/availability.sh data ${MONTH:+"$MONTH"}

      - name: Push what changed
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Collect $(date -u +%Y-%m-%d)"
          git push --quiet origin data

      - name: Deploy, since a push made with the token does not trigger it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run Deploy --repo "$REPO"
