---
name: Deploy
on:
  push:
    branches: ["main", "data"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Overlay the data branch
        run: git fetch --quiet origin data && git checkout --quiet origin/data -- . || echo "no data branch yet"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: chaotic-ground/wikven/actions/bake@3d6ba3ad0e2b29d3fb855aa17a57147497258f27  # v1.0.0
        with:
          source: .
          output: dist

      - name: Add the PR previews
        run: |
          git fetch --quiet origin previews || { echo "no previews yet"; exit 0; }
          git --work-tree=dist checkout --quiet origin/previews -- .

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
