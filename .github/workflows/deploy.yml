---
name: Deploy
on:
  push:
    branches: ["main", "data"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Overlay the data branch, main's own files winning
        run: |
          git fetch --quiet origin data || { echo "no data branch yet"; exit 0; }
          git checkout --quiet origin/data -- .
          git checkout --quiet HEAD -- .

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Write the availability chart's data
        run: scripts/availability-chart.sh

      - name: Write the cost charts' data
        run: scripts/cost-chart.sh

      - id: renderer
        name: Start the chart renderer
        run: scripts/chart-renderer.sh >> "$GITHUB_OUTPUT"

      - uses: chaotic-ground/wikven/actions/bake@79c58df9b0fd9a92143c3cd76e0e677f9de10d45  # v1.2.0
        with:
          hosts: host.docker.internal=${{ steps.renderer.outputs.address }}
          source: .
          output: dist

      - name: Add the PR previews
        run: |
          git fetch --quiet origin previews || { echo "no previews yet"; exit 0; }
          git archive origin/previews | tar -x -C dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
