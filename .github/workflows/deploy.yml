---
name: Deploy
on:
  push:
    branches: ["main", "data"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Overlay the data branch, main's own files winning
        run: |
          git fetch --quiet origin data || { echo "no data branch yet"; exit 0; }
          git checkout --quiet origin/data -- .
          git checkout --quiet HEAD -- .

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Write the availability chart's data
        run: scripts/availability-chart.sh

      - name: Write the cost charts' data
        run: scripts/cost-chart.sh

      - id: renderer
        name: Start the chart renderer
        run: scripts/chart-renderer.sh >> "$GITHUB_OUTPUT"

      - uses: chaotic-ground/wikven/actions/bake@79c58df9b0fd9a92143c3cd76e0e677f9de10d45  # v1.2.0
        with:
          hosts: host.docker.internal=${{ steps.renderer.outputs.address }}
          source: .
          output: dist

      - id: previews
        name: Add the PR previews
        run: |
          echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          git fetch --quiet origin previews || { echo "no previews yet"; exit 0; }
          git archive origin/previews | tar -x -C dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      # A deployment created before the previews were fetched is in what went live
      - name: Mark the published previews as live
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          LAID_AT: ${{ steps.previews.outputs.at }}
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo,
              environment: 'preview',
              per_page: 100,
            });
            for (const deployment of deployments) {
              if (deployment.created_at > process.env.LAID_AT) continue;
              const { data: [status] } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo,
                deployment_id: deployment.id,
                per_page: 1,
              });
              if (status?.state !== 'in_progress') continue;
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: deployment.id,
                state: 'success',
                environment_url: `https://${context.repo.owner}.github.io/pr-preview/pr-${deployment.payload.number}/`,
                auto_inactive: false,
                description: 'Preview is live',
              });
            }

  # Posts each new incident report once it is live, so the link works
  mastodon:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: data
          path: data
          persist-credentials: true

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          LIST: data/Module:사고 보고서/마스토돈.json
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          SERVER: https://mastodon.social
        with:
          script: |
            const { default: post } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/mastodon.mts`)
            await post({ core, env: process.env })

      # Also when posting stopped partway, to keep what did go out
      - name: Push the list
        if: always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Post incident reports to Mastodon"
          # Collect may have pushed meanwhile; it never touches the list
          git push --quiet origin data || { git pull --quiet --rebase origin data && git push --quiet origin data; }
