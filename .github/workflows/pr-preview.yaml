---
name: PR preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions: {}
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Overlay the data branch
        if: github.event.action != 'closed'
        run: git fetch --quiet origin data && git checkout --quiet origin/data -- . || echo "no data branch yet"

      - if: github.event.action != 'closed'
        uses: chaotic-ground/wikven/actions/bake@3d6ba3ad0e2b29d3fb855aa17a57147497258f27  # v1.0.0
        with:
          source: .
          output: dist

      - name: Store it as pr-preview/pr-N on the previews branch, or remove it on close
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9  # v1.8.1
        with:
          source-dir: dist
          preview-branch: previews
          umbrella-dir: pr-preview
          comment: false

      - name: Deploy, which serves the previews next to the site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run Deploy --repo "$REPO"

      - name: Record the preview as a deployment on the PR
        if: success() && github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const number = context.payload.number;
            const url = `https://${context.repo.owner}.github.io/pr-preview/pr-${number}/`;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: `Preview for PR #${number}`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: url,
              auto_inactive: false,
              description: 'Preview is live',
            });

      - name: Mark the deployment inactive on close
        if: always() && github.event.action == 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'preview',
              ref: context.payload.pull_request.head.sha,
            });
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Preview removed',
              });
            }
