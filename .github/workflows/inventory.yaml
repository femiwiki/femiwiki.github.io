---
name: Inventory
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: data
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Check out the data branch, or start it
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=data data
          cd data
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}"
          git pull --quiet origin data || true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/inventory.sh data

      - name: Push what changed
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Inventory $(date -u +%Y-%m-%d)"
          git push --quiet origin data

      - name: Deploy, since a push made with the token does not trigger it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run Deploy --repo "$REPO"
