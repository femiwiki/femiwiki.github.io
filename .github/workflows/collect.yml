---
name: Collect
on:
  schedule:
    - cron: "0 1 2 * *"
    # Grafana keeps the probes' metrics 14 days, so availability is read every day
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: One month to fetch as YYYY-MM, instead of the last two
        required: false
permissions: {}
concurrency:
  group: data
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install the PDF tools the redaction needs, and Miller for the export's CSV
        run: sudo apt-get install -y --no-install-recommends poppler-utils ghostscript imagemagick miller

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/femiwiki-github-io
          aws-region: ap-northeast-1

      - name: Check out the data branch, or start it
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=data data
          cd data
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}"
          git pull --quiet origin data || true

      - if: github.event.schedule != '30 0 * * *'
        env:
          MONTH: ${{ inputs.month }}
        run: scripts/collect.sh data ${MONTH:+"$MONTH"}

      # Without Google the probes still get written, since Grafana drops them in 14 days
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        id: google
        continue-on-error: true
        with:
          workload_identity_provider: "projects/611763704636/locations/global/\
            workloadIdentityPools/github/providers/femiwiki-github-io"
          service_account: femiwiki-github-io@femiwiki-b2dad.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
          export_environment_variables: false

      - env:
          MONTH: ${{ inputs.month }}
          GA_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GA_PROPERTY: "258014701"
          GRAFANA_PROMETHEUS: ${{ secrets.GRAFANA_PROMETHEUS }}
        run: scripts/availability.sh data ${MONTH:+"$MONTH"}

      # A month the wiki missed can be added later by running this with the month
      - if: github.event.schedule != '30 0 * * *'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          MONTH: ${{ inputs.month }}
          GA_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GA_PROPERTY: "258014701"
          WIKI_BOT_USER: ${{ secrets.WIKI_BOT_USER }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
        with:
          script: |
            const { default: record } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ga-record.mts`)
            await record({ core, env: process.env })

      - if: github.event.schedule != '30 0 * * *'
        env:
          MONTH: ${{ inputs.month }}
        run: scripts/hosts.sh data ${MONTH:+"$MONTH"}

      - name: Push what changed
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Collect $(date -u +%Y-%m-%d)"
          git push --quiet origin data

      - name: Deploy, since a push made with the token does not trigger it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run Deploy --repo "$REPO"
